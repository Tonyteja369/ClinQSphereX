version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: trialbridge
      POSTGRES_USER: tb_user
      POSTGRES_PASSWORD: tb_pass
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://tb_user:tb_pass@db:5432/trialbridge
      ADMIN_USER: admin@trialbridge.local
      ADMIN_PASS: adminpass
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/app:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app

volumes:
  db-data:
